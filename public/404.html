<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Doorverwijzen...</title>
  <script>
    // GitHub Pages SPA-redirect: zet het pad om naar een hash-route.
    //
    // GitHub Pages kent geen server-side routing: een URL als
    // /willebroek/fysica bestaat niet als bestand en levert deze 404 op.
    // Hier wordt het pad omgezet naar de hash-variant die de app wel kent.
    //
    // Twee dingen die hier misgaan als je ze wijzigt:
    //  1. De hash moet '#/' zijn, niet '#!/'. Vue Router stript de '!' niet,
    //      dus '#!/fysica' wordt gelezen als '/!/fysica' en matcht niets.
    //  2. Het eerste padsegment is de repo-naam — hier bewust niet hardcoded,
    //     zodat dit bestand ongewijzigd mee kan naar een volgende school.
    var segments = window.location.pathname.split('/').filter(Boolean)
    var base = '/' + (segments[0] || '') + '/'
    var rest = segments.slice(1)

    window.location.replace(
      rest.length > 0 ? base + '#/' + rest.join('/') : base
    )
  </script>
  <noscript>
    <meta http-equiv="refresh" content="0;url=./" />
  </noscript>
</head>
<body>
  <p>Doorverwijzen naar de app...</p>
  <p><a href="./">Klik hier als u niet automatisch wordt doorgestuurd.</a></p>
</body>
</html>
